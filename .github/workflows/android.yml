name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Project and APK
        run: |
          # البحث عن مكان ملف package.json والجمود عنده
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          echo "Project directory is: $TARGET_DIR"
          cd "$TARGET_DIR"

          # تثبيت المكتبات وبناء المشروع
          npm install
          npm run build

          # إعداد مجلد أندرويد وتزامن كاباسيتور
          npx cap sync android || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          cd "$TARGET_DIR"
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug
          else
            echo "Android directory not found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: '**/android/app/build/outputs/apk/debug/app-debug.apk'
